name: Test

# PR gate: typecheck + unit tests. Runs on pull requests and pushes to main so
# a regression can't merge or deploy silently.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow only reads the repo. Stating it explicitly means a compromised
# dependency or action cannot use the job's token to write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Advisories against runtime dependencies are a release decision, not a
      # surprise. Reported every run; see docs/SECURITY-PLAN.md for the open one.
      - run: npm audit --omit=dev || true
        name: Report dependency advisories (informational)

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
